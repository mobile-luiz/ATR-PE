<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Preço de Cana — quanto o fornecedor vai receber</title>
  <meta name="description" content="Controle de entregas de cana, ATR e valor a receber para fornecedores de Pernambuco.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="nav" aria-label="Menu principal">
      <div class="marca">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M10 30V2M10 9h4M10 17h4M10 24h4M20 30V6M20 12h-4M20 20h-4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M20 6c3-3 7-3 9-2-3 1-6 3-9 6M10 2c-3-1-6 0-8 2 3 0 5 1 8 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Preço de Cana</span>
      </div>
      <nav>
        <button class="nav-item ativo" data-view="painel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Painel</span></button>
        <button class="nav-item" data-view="entregas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7M7 19a2 2 0 1 0 0-.01M17 19a2 2 0 1 0 0-.01"/></svg><span>Entregas</span></button>
        <button class="nav-item" data-view="calculadora"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18H6zM9 7h6M9 12h.01M12 12h.01M15 12h.01M9 16h.01M12 16h.01M15 16h.01"/></svg><span>Calcular</span></button>
        <button class="nav-item" data-view="precos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M17 7.5c-1-1.5-3-2-5-2-2.5 0-4 1.2-4 3s1.5 2.6 4 3.2 4 1.4 4 3.3-1.6 3-4 3c-2.2 0-4-.7-5-2.2"/></svg><span>Preço ATR</span></button>
        <button class="nav-item" data-view="grafico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18M7 15l4-5 3 3 5-7"/></svg><span>Gráfico</span></button>
      </nav>
    </aside>

    <main id="conteudo">
      <section class="view ativa" id="v-painel"></section>
      <section class="view" id="v-entregas"></section>
      <section class="view" id="v-calculadora"></section>
      <section class="view" id="v-precos"></section>
      <section class="view" id="v-grafico"></section>
    </main>
  </div>

  <input type="file" id="arq-csv" accept=".csv,text/csv" hidden>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
